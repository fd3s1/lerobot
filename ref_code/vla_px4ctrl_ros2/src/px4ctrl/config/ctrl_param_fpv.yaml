px4ctrl:
  ros__parameters:
    ctrl_freq_max: 100.0
    max_manual_vel: 1.5
    frame_id: map
    use_bodyrate_ctrl: true

    topics:
      rc: /mavros/rc/in
      odom: /mavros/local_position/odom
      imu: /mavros/imu/data
      cmd: /position_cmd
      takeoff_land: /px4ctrl/takeoff_land
      setpoint: /mavros/setpoint_raw/attitude
      expert_pose: /px4ctrl/expert_pose
      gripper_command: /gripper/command
      traj_start_trigger: /traj_start_trigger
      state: /mavros/state
      extended_state: /mavros/extended_state
      battery: /mavros/battery
    services:
      set_mode: /mavros/set_mode
      arming: /mavros/cmd/arming
      command: /mavros/cmd/command

    msg_timeout:
      odom: 0.5
      imu: 0.5
      rc: 0.5
      cmd: 0.5
      bat: 0.5

    rc_reverse:
      roll: false
      pitch: true
      yaw: false
      throttle: true

    auto_takeoff_land:
      enable: true
      enable_auto_arm: true
      no_RC: false
      takeoff_height: 1.0
      takeoff_land_speed: 0.2

    limits:
      x_min: -11.0
      x_max: 11.0
      y_min: -4.1
      y_max: 4.1
      z_min: -0.3
      z_max: 2.5

    gripper:
      rc_channel: 10
      pwm_open: 1300
      pwm_close: 1700
      open_position: 100.0
      closed_position: 0.0
      force_open_below_z: 0.20

    cmd_feedforward:
      enable: false
      max_velocity: 1.5
      max_acceleration: 1.0

    controller:
      gravity: 9.81
      max_angle_deg: 25.0
      max_bodyrate_x: 2.0
      max_bodyrate_y: 2.0
      max_bodyrate_z: 1.5
      min_thrust: 0.05
      max_thrust: 0.90

    ude:
      Kp_diag: [1.3, 1.3, 1.3]
      Kd_diag: [1.8, 1.8, 1.8]
      T_diag: [0.5, 0.5, 0.5]
      max_f_hat: [5.0, 5.0, 5.0]
      max_u_acc: [5.0, 5.0, 5.0]

    attitude:
      KAng_diag: [6.0, 6.0, 3.0]

    thrust_model:
      hover_thrust: 0.35
      enable_estimation: true
      print_value: true
      rho2: 0.998
      min_thr2acc: 5.0
      max_thr2acc: 40.0

feetech_gripper_node:
  ros__parameters:
    command_topic: /gripper/command
    command_pair_topic: /gripper/command_pair
    feedback_topic: /gripper/feedback
    feedback_rate_hz: 20.0
    port: /dev/ttyACM1
    left_id: 1
    right_id: 2
    left_inverted: true
    right_inverted: true
    torque_limit: 0
    goal_velocity: 0
    acceleration: 0
    open_on_shutdown: true
    shutdown_open_position: 100.0
    shutdown_open_repeats: 3
    no_configure: false
    dry_run: false
    lerobot_src: /home/user/vla_drone/lerobot/src

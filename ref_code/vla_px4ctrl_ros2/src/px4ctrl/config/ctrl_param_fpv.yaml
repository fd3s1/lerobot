px4ctrl:
  ros__parameters:
    ctrl_freq_max: 100.0
    max_manual_vel: 4.0
    frame_id: map
    use_bodyrate_ctrl: false

    topics:
      rc: /mavros/rc/in
      odom: /mavros/local_position/odom
      mocap_pose: /mavros/vision_pose/pose
      mocap_twist: /vla_drone1/twist
      imu: /mavros/imu/data
      cmd: /position_cmd
      takeoff_land: /px4ctrl/takeoff_land
      setpoint: /mavros/setpoint_raw/attitude
      simulink_setpoint: /px4ctrl/simulink/attitude_target
      simulink_reference: /px4ctrl/simulink/reference_state
      simulink_actual: /px4ctrl/simulink/actual_state
      simulink_tracking_error: /px4ctrl/simulink/tracking_error
      simulink_ude_debug: /px4ctrl/simulink/ude_debug
      simulink_yaw_debug: /px4ctrl/simulink/yaw_debug
      ude_tune: /px4ctrl/ude_tune
      ude_tune_status: /px4ctrl/ude_tune_status
      ude_tune_status_text: /px4ctrl/ude_tune_status_text
      mocap_state_status: /px4ctrl/mocap_state_status
      expert_pose: /px4ctrl/expert_pose
      gripper_command: /gripper/command
      traj_start_trigger: /traj_start_trigger
      state: /mavros/state
      extended_state: /mavros/extended_state
      battery: /mavros/battery
    services:
      set_mode: /mavros/set_mode
      arming: /mavros/cmd/arming
      command: /mavros/cmd/command

    msg_timeout:
      odom: 1.5
      mocap_pose: 0.3
      mocap_twist: 0.3
      imu: 0.5
      rc: 0.5
      cmd: 0.5
      bat: 0.5

    rc_reverse:
      roll: false
      pitch: true
      yaw: false
      throttle: true

    auto_takeoff_land:
      enable: true
      enable_auto_arm: true
      no_RC: false
      takeoff_height: 0.65
      takeoff_land_speed: 0.25

    limits:
      x_min: -2.01
      x_max: 15.11
      y_min: -2.11
      y_max: 2.11
      z_min: -0.3
      z_max: 2.5

    gripper:
      rc_channel: 10
      pwm_open: 1300
      pwm_close: 1700
      open_position: 100.0
      closed_position: 0.0
      force_open_below_z: 0.20

    cmd_feedforward:
      enable: false
      max_velocity: 4.0
      max_acceleration: 15.0

    mocap_state:
      enable: true
      twist_frame: map
      max_pair_dt_s: 0.1
      max_odom_attitude_dt_s: 0.1
      fallback_to_odom: true

    td:
      enable: true
      r_diag: [2.0, 2.0, 2.0]

    controller:
      gravity: 9.81
      max_angle_deg: 45.0
      max_bodyrate_x: 5.0
      max_bodyrate_y: 5.0
      max_bodyrate_z: 5.0
      min_thrust: 0.05
      max_thrust: 0.90

    ude:
      enable: true
      Kp_diag: [1.6,1.6,1.6]
      Kd_diag: [2.0,2.0,2.0]
      T_diag: [0.35, 0.35, 0.35]
      max_f_hat: [11.0, 11.0, 11.0]
      max_u_acc: [11.0, 11.0, 11.0]

    attitude:
      feedback_mode: full_quaternion
      KAng_diag: [6.0, 6.0, 1.0]
      yaw_deadband_rad: 0.03
      yaw_rate_limit: 0.08
      yaw_lpf_tau_s: 0.15

    thrust_model:
      hover_thrust: 0.35
      enable_estimation: true
      print_value: false
      rho2: 0.980
      min_thr2acc: 2.0
      max_thr2acc: 80.0

feetech_gripper_node:
  ros__parameters:
    command_topic: /gripper/command
    command_pair_topic: /gripper/command_pair
    feedback_topic: /gripper/feedback
    feedback_rate_hz: 20.0
    port: /dev/ttyACM1
    left_id: 1
    right_id: 2
    left_inverted: true
    right_inverted: true
    torque_limit: 0
    goal_velocity: 0
    acceleration: 0
    open_on_shutdown: true
    shutdown_open_position: 100.0
    shutdown_open_repeats: 3
    no_configure: false
    dry_run: false
    lerobot_src: /home/user/vla_drone/lerobot/src
